spring:
  application:
    name: ecommerce
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:ecommerce}
    username: ${POSTGRES_USER:ecommerce_user}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60